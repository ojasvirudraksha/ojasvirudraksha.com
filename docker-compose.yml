name: ojasvirudraksha

services:
  web:
    container_name: ojasvirudraksha-web
    restart: unless-stopped
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed_astrol && python manage.py import_reference_catalog && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app