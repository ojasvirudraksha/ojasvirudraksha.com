{% extends 'accounts/auth_layout.html' %}
{% block auth_content %}{% if validlink %}<h2>Set a new password</h2><form method="post" class="account-form">{% csrf_token %}{% include 'accounts/fields.html' %}<button class="account-button" type="submit">Save new password</button></form>{% else %}<h2>This link has expired</h2><p>Request a new password reset link to continue.</p><a class="account-button" href="{% url 'account_reset' %}">Request a new link</a>{% endif %}{% endblock %}
